    <g transform="translate(400,0)">
      <line x1="0" y1="14" x2="0" y2="106" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="100" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffb000">4</text>
      <text x="100" y="74" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#00f5a0">LANGUAGES</text>
      <text x="100" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b98a5">EN · FR · ES · ZH</text>
