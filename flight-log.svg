<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" role="img" aria-label="Flight log: 3 internships, 5 countries, 4 languages">
  <defs>
    <linearGradient id="flg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#0072ff"/>
      <stop offset="1" stop-color="#00f5a0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="596" height="116" rx="14" fill="#0d1117" stroke="url(#flg)" stroke-width="2"/>
  
    <g transform="translate(0,0)">
      <line x1="0" y1="14" x2="0" y2="106" stroke="#30363d" stroke-width="0" stroke-dasharray="4 4"/>
      <text x="100" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffb000">3</text>
      <text x="100" y="74" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#00f5a0">INTERNSHIPS</text>
      <text x="100" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b98a5">REACTIS · BARJANE · CPAM</text>
    </g>
    <g transform="translate(200,0)">
      <line x1="0" y1="14" x2="0" y2="106" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="100" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffb000">5</text>
      <text x="100" y="74" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#00f5a0">COUNTRIES</text>
      <text x="100" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b98a5">lived in</text>
