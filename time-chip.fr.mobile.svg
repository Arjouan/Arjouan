<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 182" width="100%" role="img" aria-label="Fuseaux horaires: MARSEILLE CET / CEST, MONTRÉAL EST / EDT">
  <defs>
    <linearGradient id="tcgm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#0072ff"/>
      <stop offset="1" stop-color="#00f5a0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="216" height="178" rx="14" fill="#0d1117" stroke="url(#tcgm)" stroke-width="2"/>
  <text x="14" y="20" font-family="Courier New, monospace" font-size="10" letter-spacing="3" fill="#8b98a5">FUSEAUX HORAIRES</text>
  
    <g transform="translate(0,26)">
      <line x1="12" y1="0" x2="208" y2="0" stroke="#30363d" stroke-width="0" stroke-dasharray="4 4"/>
      <text x="14" y="22" font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#00f5a0">MARSEILLE</text>
      <text x="14" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">CET / CEST</text>
      <text x="14" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b98a5">UTC+1 · UTC+2 en été</text>
    </g>
    <g transform="translate(0,104)">
      <line x1="12" y1="0" x2="208" y2="0" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="14" y="22" font-family="Courier New, monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#00f5a0">MONTRÉAL</text>
      <text x="14" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">EST / EDT</text>
      <text x="14" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b98a5">UTC−5 · UTC−4 en été</text>
    </g>
</svg>
