name: Update local time chip

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate time-chip.svg
        run: node scripts/generate-time-chip.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- time-chip.svg; then
            echo "No changes to time-chip.svg"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add time-chip.svg
          git commit -m "[BOT] refresh local time chip"
          git push
