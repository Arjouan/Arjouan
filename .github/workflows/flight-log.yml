name: Update flight log stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate flight-log.svg
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/generate-flight-log.mjs

      - name: Generate header-stats.svg
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/generate-header-stats.mjs

      - name: Generate flight-manifest cards
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/generate-flight-manifest.mjs

      - name: Commit if changed
        run: |
          FILES="flight-log.svg header-stats.svg flight-manifest-portfolio.svg flight-manifest-portfolio.fr.svg flight-manifest-epitech.svg flight-manifest-epitech.fr.svg"
          if git diff --quiet -- $FILES; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "[BOT] refresh flight log, header stats, and flight manifest"
          git push
