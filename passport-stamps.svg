<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" role="img" aria-label="Internship stamps: REACTIS, BARJANE, CPAM">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#00f5a0"/>
    </linearGradient>
  </defs>

  <!-- REACTIS -->
  <g transform="translate(130,72) rotate(-8)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="1.6;1" dur="0.35s" begin="0.2s" fill="freeze"/>
      <rect x="-52" y="-46" width="104" height="92" rx="10" fill="none" stroke="url(#pg)" stroke-width="3"/>
      <text y="-4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#4aa8ff">REACTIS</text>
      <text y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b98a5">2026</text>
    </g>
  </g>

  <!-- BARJANE -->
  <g transform="translate(360,72) rotate(6)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="1.6;1" dur="0.35s" begin="0.55s" fill="freeze"/>
      <rect x="-52" y="-46" width="104" height="92" rx="10" fill="none" stroke="url(#pg)" stroke-width="3"/>
      <text y="-4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#4aa8ff">BARJANE</text>
      <text y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b98a5">2025</text>
    </g>
  </g>

  <!-- CPAM -->
  <g transform="translate(590,72) rotate(-5)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="1.6;1" dur="0.35s" begin="0.9s" fill="freeze"/>
      <rect x="-52" y="-46" width="104" height="92" rx="10" fill="none" stroke="url(#pg)" stroke-width="3"/>
      <text y="-4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#4aa8ff">CPAM</text>
      <text y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b98a5">2024</text>
    </g>
  </g>
</svg>
