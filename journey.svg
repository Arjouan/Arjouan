<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="800" role="img" aria-label="A plane flying along a route">
  <defs>
    <linearGradient id="jg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#0072ff"/>
      <stop offset="1" stop-color="#00f5a0"/>
    </linearGradient>
  </defs>

  <!-- dashed flight route -->
  <path d="M20 68 Q200 18 400 44 T780 22" fill="none" stroke="url(#jg)" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.8"/>

  <!-- plane flying along the route -->
  <path d="M-11 -6 L11 0 L-11 6 L-4 0 Z" fill="url(#jg)">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" path="M20 68 Q200 18 400 44 T780 22"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.92;1" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
