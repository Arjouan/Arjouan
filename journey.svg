<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" role="img" aria-label="Flight route across the countries I have lived in">
  <defs>
    <linearGradient id="jg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#0072ff"/>
      <stop offset="1" stop-color="#00f5a0"/>
    </linearGradient>
  </defs>

  <!-- flight route -->
  <path d="M65 105 L235 85 L410 70 L585 54 L760 40" fill="none" stroke="url(#jg)" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.85"/>

  <!-- stop markers -->
  <g fill="url(#jg)">
    <circle cx="65" cy="105" r="5"/>
    <circle cx="235" cy="85" r="5"/>
    <circle cx="410" cy="70" r="5"/>
    <circle cx="585" cy="54" r="5"/>
    <circle cx="760" cy="40" r="5"/>
  </g>

  <!-- country labels -->
  <g fill="#4aa8ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <text x="65" y="129">Singapore</text>
    <text x="235" y="109">Vietnam</text>
    <text x="410" y="94">Australia</text>
    <text x="585" y="78">France</text>
    <text x="760" y="64">Canada</text>
  </g>

  <!-- plane hopping from country to country -->
  <path d="M-11 -6 L11 0 L-11 6 L-4 0 Z" fill="url(#jg)">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto" calcMode="linear"
      keyPoints="0;0;0.245;0.245;0.497;0.497;0.749;0.749;1;1"
      keyTimes="0;0.1;0.225;0.325;0.45;0.55;0.675;0.775;0.9;1"
      path="M65 105 L235 85 L410 70 L585 54 L760 40"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.5;0.96;1" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>
